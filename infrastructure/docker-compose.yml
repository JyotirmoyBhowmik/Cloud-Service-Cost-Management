version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudscope-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudscope
      POSTGRES_PASSWORD: cloudscope_secure_pass_2026!
      POSTGRES_DB: cloudscope_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudscope -d cloudscope_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudscope-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cloudscope-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://cloudscope:cloudscope_secure_pass_2026!@postgres:5432/cloudscope_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: "cloudscope-production-master-secret-key-32-bytes!"
      DEMO_MODE_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cloudscope-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
